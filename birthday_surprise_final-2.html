<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For My Love ♡</title>
<style>
:root{--bg:#09090d;--card:#15151d;--pink:#ff7eb6;--rose:#ffb3d1;--purple:#b99cff;--white:#f8f6fb;--muted:#bcb7c7;--green:#73e6a1;--red:#ff7187}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#241a32 0 12%,transparent 35%),radial-gradient(circle at 85% 80%,#301827 0 8%,transparent 35%),var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:42px 42px;opacity:.12}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}.screen{width:min(680px,100%);text-align:center;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(2.1rem,8vw,4.4rem);margin:8px 0 12px;line-height:1.05;background:linear-gradient(90deg,var(--rose),#fff,var(--purple));-webkit-background-clip:text;color:transparent}
h2{font-size:clamp(1.7rem,6vw,2.6rem);margin:8px 0 14px}p{font-size:1.05rem;line-height:1.65;color:#eee;margin:10px auto;max-width:570px}
.subtitle{color:var(--muted)}.cat{font-size:4rem;filter:drop-shadow(0 0 14px #ff8fbe55);margin-bottom:4px}.orca{font-size:3.3rem}
button{font:inherit;color:var(--white);border:1px solid #ffffff22;background:#ffffff0b;padding:13px 19px;border-radius:16px;cursor:pointer;transition:.18s;box-shadow:0 8px 30px #0004}
button:hover{transform:translateY(-2px);background:#ffffff16;border-color:#ff9dc633}.arrow{margin-top:20px;font-size:1.3rem;padding:12px 25px;border-radius:999px;background:linear-gradient(135deg,#ff77ad,#9d83ff);border:0}
.card{background:#ffffff0a;border:1px solid #ffffff16;border-radius:26px;padding:28px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(12px)}
.progress{font-size:.8rem;color:#a9a2b4;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}
.gamegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:380px;margin:22px auto}.tile{aspect-ratio:1;border-radius:15px;background:linear-gradient(135deg,#282333,#17151e);display:flex;align-items:center;justify-content:center;font-size:1.7rem;border:1px solid #ffffff12}.tile:hover{background:#302840}
.memory-info{min-height:28px;color:var(--muted)}.gift{margin:25px auto;font-size:5rem;cursor:pointer;display:inline-block;filter:drop-shadow(0 0 18px #ff8fbe66);transition:.25s}.gift:hover{transform:scale(1.08) rotate(-3deg)}
.photo{width:100%;max-width:360px;aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:#25212e;border:1px dashed #ffffff35;display:block;margin:18px auto}
.placeholder{display:flex;align-items:center;justify-content:center;color:#aaa0b2;font-size:.9rem;padding:20px}
.options{display:grid;gap:11px;margin:20px auto;max-width:520px}.answer{width:100%;text-align:left}.answer.correct{border-color:var(--green);background:#73e6a122}.answer.wrong{border-color:var(--red);background:#ff718722}
.feedback{min-height:30px;font-weight:700}.finalmsg{font-size:1.12rem}.decor{position:fixed;pointer-events:none;font-size:1.4rem;opacity:.7;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}
.small{font-size:.85rem;color:#9993a3}.code-card{max-width:560px}.mini-paws{font-size:1.05rem;letter-spacing:3px;margin-bottom:4px}.clues{text-align:left;background:#ffffff08;border:1px solid #ffffff12;border-radius:18px;padding:10px 18px;margin:20px 0}.clues p{margin:12px 0}.code-input{width:100%;box-sizing:border-box;padding:15px;border-radius:15px;border:1px solid #ffffff22;background:#ffffff0b;color:white;font:inherit;text-align:center;font-size:1.4rem;letter-spacing:8px;outline:none}.main-btn{margin-top:13px;width:100%;font:inherit;color:white;border:0;background:linear-gradient(135deg,#ff77ad,#9d83ff);padding:14px 20px;border-radius:16px;cursor:pointer}.feedback{color:#ff9fba;font-weight:700;min-height:24px}.clue-note{font-size:.78em;color:#aaa0b0}
.gift-note{font-size:1rem;color:#f4c7df;margin:8px auto 12px}.third-gift-message{margin:20px auto;padding:18px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff12;line-height:1.6}.final-photos{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;margin-top:20px;align-items:center}.final-photos img{width:100%;height:auto;display:block;border-radius:18px;object-fit:contain;background:#15131a}.final-photos img:nth-child(2){max-height:520px}.final-photos img:nth-child(1),.final-photos img:nth-child(3){max-height:520px}
</style>
</head>
<body>
<div id="lock" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,#241a32,transparent 40%),radial-gradient(circle at 80% 80%,#301827,transparent 40%),#09090d;">
<div style="width:min(430px,100%);text-align:center;background:#ffffff0a;border:1px solid #ffffff16;border-radius:26px;padding:32px 24px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(12px);">
<div style="font-size:4rem">🐾🔐✨</div>
<h1 style="font-size:2.2rem;margin:12px 0;background:linear-gradient(90deg,#ffb3d1,#fff,#b99cff);-webkit-background-clip:text;color:transparent;">For one person only ♡</h1>
<p style="color:#eee;line-height:1.6;">This little surprise is locked...<br>Enter the secret password to open it 👀</p>
<input id="pw" type="password" placeholder="password" autocomplete="off" style="width:100%;padding:14px 16px;border-radius:15px;border:1px solid #ffffff22;background:#ffffff0b;color:white;font:inherit;outline:none;text-align:center;">
<button onclick="unlock()" style="margin-top:13px;width:100%;font:inherit;color:white;border:0;background:linear-gradient(135deg,#ff77ad,#9d83ff);padding:14px 20px;border-radius:16px;cursor:pointer;">♡ unlock ♡</button>
<div id="pwmsg" style="min-height:24px;margin-top:12px;color:#ff9fba;font-size:.9rem;"></div>
</div></div>
<div id="app"></div>
<script>
function unlock(){const input=document.getElementById("pw"),msg=document.getElementById("pwmsg");if(input.value==="meow"){document.getElementById("lock").style.display="none";sessionStorage.setItem("birthdayUnlocked","yes");}else{msg.textContent="Nope hehe 😼 Try again!";input.value="";}}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if(sessionStorage.getItem("birthdayUnlocked")==="yes")document.getElementById("lock").style.display="none";
</script>

let state={
 page:0,
 selected:[],
 answers:[null,null,null],
 revealed:false,
 quizResultShown:false,
 codeError:false,
 memoryBoard:null
};

let matchedIndices=[];
let picks=[];

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function initMemory(){
 if(!state.memoryBoard){
   state.memoryBoard=shuffle(["💓","🩷","💕","💗","💓","🩷","💕","💗"]);
 }
}

function render(){
 const a=document.getElementById("app");
 let content="";

 if(state.page===0) content=`<div class="screen"><div class="cat">🐾✨</div><h1>Happy 16th Birthday,<br>my love ♡</h1><p>I made something for you!!!</p><p class="orca">💕 🫍 ✨ 🐾</p><button class="arrow" onclick="next()">→</button></div>`;

 if(state.page===1) content=`<div class="screen card"><div class="progress">♡ little birthday adventure ♡</div><div class="orca">🫍✨</div><h2>For each gift...</h2><p>you need to win a little game first!</p><p class="small">Don't worry it's easy!</p><button class="arrow" onclick="next()">→</button></div>`;

 if(state.page===2) content=memoryGame();

 if(state.page===3) content=`<div class="screen card"><h2>Congratulations!!</h2><p>Here's your first gift, my love ♡</p><div class="gift" onclick="openGift(0)">🎁</div><p class="small">${state.revealed?"You opened it! ✨":"Tap the gift to unwrap it"}</p>${state.revealed?`<p class="gift-note">Here you go! 💗</p>${photo(0)}<p class="gift-note">Dont worry youll get the full version soon! 💗</p><button class="arrow" onclick="next()">→</button>`:""}</div>`;

 if(state.page===4) content=quiz();

 if(state.page===5) content=secondGift();

 if(state.page===6) content=codeBreaker();


 if(state.page===8) content=finalPage();

 a.innerHTML=content;
}

function next(){
 state.page++;
 state.revealed=false;
 render();
 window.scrollTo(0,0);
}

function photo(i){
 return `<img class="photo" src="${gifts[i].photo}" alt="${gifts[i].alt}" onerror="this.outerHTML='<div class=\\'photo placeholder\\'>PUT YOUR GIFT PHOTO HERE<br>${gifts[i].photo}</div>'">`;
}

function openGift(i){
 state.revealed=true;
 render();
}

function memoryGame(){
 initMemory();

 if(matchedIndices.length===8){
   return `<div class="screen card"><div class="cat">✨</div><h2>You did it!!</h2><p>You solved the puzzle! That was your first challenge!</p><button class="arrow" onclick="next()">→</button></div>`;
 }

 return `<div class="screen card"><div class="progress">game 1 · tiny memory puzzle</div><h2>Match the pairs</h2><p>Tap two tiles at a time. Find all 4 pairs!</p><div class="memory-info">Matches: ${matchedIndices.length/2}/4</div><div class="gamegrid">${state.memoryBoard.map((s,i)=>`<button class="tile" onclick="pick(${i},'${s}',this)">${state.selected.includes(i)||matchedIndices.includes(i)?s:"?"}</button>`).join("")}</div></div>`;
}

function pick(i,s,el){
 if(picks.length===2||state.selected.includes(i)||matchedIndices.includes(i))return;

 state.selected.push(i);
 el.textContent=s;
 picks.push([i,s]);

 if(picks.length===2){
   if(picks[0][1]===picks[1][1]){
     matchedIndices.push(picks[0][0],picks[1][0]);
     picks=[];
     state.selected=[];
     setTimeout(render,350);
   }else{
     setTimeout(()=>{
       state.selected=[];
       picks=[];
       render();
     },650);
   }
 }
}

const qs=[
 ["When did we meet?",["April 5th","March 7th","May 6th"],0],
 ["What's my favorite colors?",["blue and pink","orange and white","pink and orange"],2],
 ["Do you love me?",["YESS OFC MOOMY","yup","yeah ofcourse"],0]
];

function quiz(){
 const done=state.answers.every(x=>x!==null);

 if(done && state.quizResultShown){
   const all=state.answers.every((x,i)=>x===qs[i][2]);
   return `<div class="screen card"><div class="cat">${all?"✨":"🩷"}</div><h2>${all?"Congratulations!!":"Almost!"}</h2><p>${all?"You got them all right!!":"You got something wrong, but don't worry, you still get your gift! :)"}</p><button class="arrow" onclick="state.page=5;state.revealed=false;render()">→</button></div>`;
 }

function answer(q,a){
 if(state.answers[q]!==null)return;
 state.answers[q]=a;
 render();
}

function showQuizResult(){

}

function codeBreaker(){
 return `<div class="screen card"><div class="mini-paws">🐾</div><h2>🔐 Secret Code</h2><p>Can you figure out the secret 6-digit code?</p><p>Solve each clue and enter the numbers in order! 💕</p><div class="clues"><p><b>1.</b> Month you were born in</p><p><b>2.</b> Your favorite animal (how many letters?)</p><p><b>3.</b> How many months are we together?</p><p><b>4.</b> How many paws do you see? <span class="clue-note">(look around this screen)</span></p><p><b>5.</b> How old are you turning?</p></div><input id="codeInput" class="code-input" inputmode="numeric" maxlength="6" placeholder="______" aria-label="6 digit code"><button class="main-btn" onclick="checkCode()">UNLOCK</button>${state.codeError?`<p class="feedback">${state.codeError}</p>`:""}</div>`;
}

function checkCode(){
 const input=document.getElementById("codeInput").value.trim();
 const code="945216";

 if(input===code){
   state.codeError=false;
   state.page=8;
 }else{
   if(input.length<6){
     const missing=6-input.length;
     state.codeError=`You're missing ${missing} number${missing===1?"":"s"}!`;
   }else{
     let wrong=0;
     for(let i=0;i<6;i++){
       if(input[i]!==code[i]) wrong++;
     }
     state.codeError=`You got ${wrong} number${wrong===1?"":"s"} wrong!`;
   }
 }
 render();
}
